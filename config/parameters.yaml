# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration

# parameters can be arrays but only the top variable is the parameter
# ie : you cannot pass an array item to services, you must pass the whole parameter
# https://symfony.com/doc/current/service_container/parameters.html

parameters:

    # Performance: Dump service container into single file
    # https://symfony.com/doc/current/performance.html#dump-the-service-container-into-a-single-file
    .container.dumper.inline_factories: true

    site_name: 'Guabao'
    email_domain: 'guabao.me'
    host: '%env(HOST)%'
    host_controlroom: '%env(HOST_CONTROLROOM)%'

    default_locale: 'en'
    locales: ['fr', 'en']

    uploads_dir: 'uploads'
    uploads_base_url: '/%uploads_dir%'
    # where uploaded files are written (UploadHelper, ImageManipulator)
    uploads_path: '%kernel.project_dir%/public/%uploads_dir%'
    # LiipImagine: where thumbnails are cached (under media/cache/) and where originals are read from
    thumbs_web_root: '%kernel.project_dir%/public/'
    thumbs_data_root: '%env(PUBLIC_DIR_SYSTEM_PATH)%'
    # when set, picture fixtures upload this file instead of the real photos (see UploadHelper)
    fixtures_placeholder_image: ~

    google_backend_api_key: '%env(GOOGLE_BACKEND_API_KEY)%'
    google_maps_js_api_key: '%env(GOOGLE_MAPS_JS_API_KEY)%'

    # small banner on top of the page warning of maintenance coming up soon
    maintenance_warning: false
    # set to true when experiencing deliverability issues
    deliverability_issues: false

    geoip_database_path: '%kernel.project_dir%/var/geoip/GeoLite2-City.mmdb'

# Tests never write into public/, and their fixtures skip the 424 MB of photo processing:
# tests/bootstrap.php builds the test database with one tiny placeholder image instead.
when@test:
    parameters:
        uploads_path: '%kernel.project_dir%/var/test/uploads'
        # thumbnails cached in var/test/media/cache, generated from var/test/uploads
        thumbs_web_root: '%kernel.project_dir%/var/test/'
        thumbs_data_root: '%kernel.project_dir%/var/test/'
        fixtures_placeholder_image: '%kernel.project_dir%/tests/fixtures/placeholder.jpg'
