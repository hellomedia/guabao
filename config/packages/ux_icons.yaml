ux_icons:
    aliases:
        theme: 'ix:light-dark'
        home: 'ph:house'
        back: 'ic:round-arrow-back-ios'
        forward: 'ic:round-arrow-forward-ios'
        trash: 'lucide:trash-2'
        account: 'qlementine-icons:user-16'
        external-link: 'prime:external-link'
        info: 'lucide:info'
        settings: 'lucide:settings'
        filter: 'mage:filter'
        grab-horizontal: 'charm:grab-horizontal'
        grab-vertical: 'charm:grab-vertical'
        dots: 'tabler:dots-vertical'
        show: 'ic:baseline-remove-red-eye'
        delete: 'ic:baseline-delete'
        language: 'mdi:language'
        login: 'material-symbols:login'
        logout: 'material-symbols:logout'
        sphere: 'icomoon-free:sphere'
        trips: 'streamline-block:travel-map'
        food: 'mdi:food-ramen'
        medias: 'lucide:image'
        sort: 'iconoir:sort'
        location: 'mdi:location'
        calendar: 'mdi:calendar'

when@dev:
    ux_icons:
        iconify:
            # Persist each on-demand icon to disk on first render, so you don't forget to commit it before deploying (like `ux:icons:lock`)
            auto_lock: true

when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
