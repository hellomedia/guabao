doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # use_savepoints: removed, DBAL 4 always uses savepoints for nested transactions

        # Assigns type to SQL query
        mapping_types:
            citext: citext

        # Data operations (does not affect SQL query)
        types:
            citext: Pack\Security\Doctrine\Types\CiText

    orm:
        # PHP 8.4 native lazy objects replace generated proxy classes (symfony/var-exporter 8 drops LazyGhostTrait);
        # auto_generate_proxy_classes / enable_lazy_ghost_objects / proxy_dir / report_fields_where_declared are
        # gone in DoctrineBundle 3. https://www.doctrine-project.org/projects/doctrine-orm/en/3.6/reference/advanced-configuration.html#native-lazy-objects
        enable_native_lazy_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Security:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/packs/Security/Entity'
                prefix: 'Pack\Security\Entity'
                alias: App # simpler to just re-use App which does not have to be unique
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
