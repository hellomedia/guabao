# ports: To avoid port conflict, for this project, add 2 (8080 => 8082, etc)
services:
  nginx:
    build: ./docker/nginx
    depends_on:
      - php
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8445:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - "./:/data/www"
      - "./docker/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./docker/nginx/fcgi.conf:/etc/nginx/fcgi.conf"
      - "./docker/nginx/common_locations.conf:/etc/nginx/common_locations.conf"
      - "./docker/nginx/ssl.conf:/etc/nginx/ssl.conf"
      #- shared_certs:/etc/nginx/ssl # share certificates with caddy - unused since we use HTTP between nginx and caddy

  php:
    build: .
    working_dir: /data/www
    depends_on:
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATABASE_HOST: database
      DATABASE_PASSWORD: "000000"
      DATABASE_USER: hellomedia
    volumes:
      - "./:/data/www"
      - "./docker/php/php-fpm.conf:/etc/php/8.5/fpm/pool.d/www.conf" # mounts php-fpm settings into the container
      - "./docker/php/80-xdebug.ini:/etc/php/8.5/fpm/conf.d/80-xdebug.ini" # mounts xdebug settings into the container
      - "./docker/php/99-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini:ro" # mounts php ini overrides for php fpm
      - "./docker/php/99-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini:ro"  # mounts php ini overrides for cli

  database:
    build: docker/postgres
    environment:
      POSTGRES_USER: "hellomedia"
      POSTGRES_PASSWORD: "000000"
      POSTGRES_DB: guabao
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - "db-data:/var/lib/postgresql/data"
   
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "hellomedia@hellomedia.com"
      PGADMIN_DEFAULT_PASSWORD: "000000"
    ports:
      - '127.0.0.1:5052:80'
    volumes:
      - 'db-pgadmin:/var/lib/pgadmin'


  # Claude code in container with no ssh access
  # ===========================================
  # Claude commits to git locally only.
  #
  # First time : docker compose build claude-code
  # Launch claude in container with a new conversation: 
  #          docker compose run --rm claude-code claude
  # Launch claude in container continuing previous conversation:
  #          docker compose run --rm claude-code claude -c 
  #
  # NB: --rm throws the container away when you exit, leaving nothing running.
  #
  # Stopping and starting containers doesn't lose Claude's memory of a project.
  # The context that matters lives in two persistent places — the CLAUDE.md, /.claude/
  # inside your repo (on disk, survives everything) and the session transcripts 
  # in the claude-config named volume (survives container stop/start, since named volumes persist independently of containers). 
  # So you can shut down HELLO KOT, bring it back up, and claude -c picks up where you left off.
  claude-code:
    environment:
      - CLAUDE_CONFIG_DIR=/home/node/.claude
    build: ./docker/claude
    working_dir: /data/www
    profiles: ["claude"]                     # keeps it OUT of your normal "docker compose up"
    cap_add:
      - NET_ADMIN                            # egress allowlist firewall (docker/claude/init-firewall.sh)
    volumes:
      - "./:/data/www"                       # your code (Claude reads, edits, commits here)
      - "claude-config:/home/node/.claude"   # persists your Claude login. Named volume, /home/node is **inside** container, not on host


